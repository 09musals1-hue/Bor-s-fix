 <!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borås År 1926 - Interaktiv Simulering</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Georgia', serif; background-color: #000; }
        #canvas-container { width: 100vw; height: 100vh; }
        #instructions {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #f0e6d2; text-align: center; background: rgba(30, 20, 10, 0.9);
            padding: 30px; border: 2px solid #c5a059; border-radius: 8px; cursor: pointer;
            box-shadow: 0 0 25px rgba(0,0,0,0.8); z-index: 10; width: 320px;
        }
        #instructions h1 { margin: 0 0 10px 0; font-size: 26px; color: #e6c585; }
        #instructions p { margin: 10px 0; font-size: 15px; line-height: 1.4; }
        #hud {
            position: absolute; bottom: 20px; left: 20px; color: #fff;
            background: rgba(0,0,0,0.7); padding: 10px 15px; border-radius: 5px;
            font-family: sans-serif; font-size: 13px; pointer-events: none; display: none;
        }
        #info-card {
            position: absolute; top: 20px; right: 20px; width: 280px;
            background: rgba(245, 238, 220, 0.95); color: #2c1d11; padding: 15px;
            border: 2px solid #8b5a2b; border-radius: 5px; display: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); font-size: 14px; line-height: 1.4;
        }
        #info-card h3 { margin-top: 0; color: #5c2c11; border-bottom: 1px solid #8b5a2b; padding-bottom: 5px; }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 8px; height: 8px;
            margin-top: -4px; margin-left: -4px; border: 2px solid rgba(255,255,255,0.7);
            border-radius: 50%; pointer-events: none; display: none;
        }
    </style>
    <!-- Three.js och PointerLockControls via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="crosshair"></div>
    <div id="hud">WASD = Gå | MUS = Titta runt | SHIFT = Springa</div>
    
    <div id="instructions">
        <h1>BORÅS ÅR 1926</h1>
        <p><strong>Klicka här för att starta spelet</strong></p>
        <p>Använd tangentbordet (WASD) och musen för att vandra runt i staden.</p>
        <p style="font-size: 12px; color: #aaa;">Tryck ESC för att frigöra muspekaren.</p>
    </div>

    <div id="info-card">
        <h3 id="info-title">Plats</h3>
        <p id="info-text">Beskrivning...</p>
    </div>

    <script>
        let scene, camera, renderer, controls;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, isSprinting = false;
        let prevTime = performance.now();
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        const landmarks = [];

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xdbe9f4);
            scene.fog = new THREE.FogExp2(0xdbe9f4, 0.007);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.y = 1.7;

            const ambientLight = new THREE.AmbientLight(0xfff5ea, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffdfb3, 0.8);
            dirLight.position.set(100, 150, 50);
            dirLight.castShadow = true;
            scene.add(dirLight);

            controls = new THREE.PointerLockControls(camera, document.body);

            const instructions = document.getElementById('instructions');
            const hud = document.getElementById('hud');
            const crosshair = document.getElementById('crosshair');

            instructions.addEventListener('click', function () {
                controls.lock();
            });

            controls.addEventListener('lock', function () {
                instructions.style.display = 'none';
                hud.style.display = 'block';
                crosshair.style.display = 'block';
            });

            controls.addEventListener('unlock', function () {
                instructions.style.display = 'block';
                hud.style.display = 'none';
                crosshair.style.display = 'none';
            });

            scene.add(controls.getObject());

            const onKeyDown = function (event) {
                switch (event.code) {
                    case 'KeyW': case 'ArrowUp': moveForward = true; break;
                    case 'KeyS': case 'ArrowDown': moveBackward = true; break;
                    case 'KeyA': case 'ArrowLeft': moveLeft = true; break;
                    case 'KeyD': case 'ArrowRight': moveRight = true; break;
                    case 'ShiftLeft': case 'ShiftRight': isSprinting = true; break;
                }
            };

            const onKeyUp = function (event) {
                switch (event.code) {
                    case 'KeyW': case 'ArrowUp': moveForward = false; break;
                    case 'KeyS': case 'ArrowDown': moveBackward = false; break;
                    case 'KeyA': case 'ArrowLeft': moveLeft = false; break;
                    case 'KeyD': case 'ArrowRight': moveRight = false; break;
                    case 'ShiftLeft': case 'ShiftRight': isSprinting = false; break;
                }
            };

            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);

            buildCity();

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            window.addEventListener('resize', onWindowResize);
        }

        function buildCity() {
            // Mark / Kullersten
            const groundGeo = new THREE.PlaneGeometry(400, 400);
            const groundMat = new THREE.MeshLambertMaterial({ color: 0x7c756b });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            scene.add(ground);

            // Viskan
            const riverGeo = new THREE.PlaneGeometry(30, 400);
            const riverMat = new THREE.MeshLambertMaterial({ color: 0x3d5a6c });
            const river = new THREE.Mesh(riverGeo, riverMat);
            river.rotation.x = -Math.PI / 2;
            river.position.set(40, 0.1, 0);
            scene.add(river);

            // Stora Bron
            const bridgeGeo = new THREE.BoxGeometry(36, 1, 14);
            const bridgeMat = new THREE.MeshLambertMaterial({ color: 0x8b8580 });
            const bridge = new THREE.Mesh(bridgeGeo, bridgeMat);
            bridge.position.set(40, 0.5, 0);
            scene.add(bridge);

            // Stora Torget
            const squareGeo = new THREE.PlaneGeometry(60, 60);
            const squareMat = new THREE.MeshLambertMaterial({ color: 0x9e9589 });
            const square = new THREE.Mesh(squareGeo, squareMat);
            square.rotation.x = -Math.PI / 2;
            square.position.set(-20, 0.15, 0);
            scene.add(square);

            // Gustav Adolfs Kyrka
            const churchBody = new THREE.Mesh(
                new THREE.BoxGeometry(20, 18, 35),
                new THREE.MeshLambertMaterial({ color: 0xa85d42 })
            );
            churchBody.position.set(-20, 9, -50);
            scene.add(churchBody);

            const tower = new THREE.Mesh(
                new THREE.BoxGeometry(10, 40, 10),
                new THREE.MeshLambertMaterial({ color: 0x945139 })
            );
            tower.position.set(-20, 20, -35);
            scene.add(tower);

            const spire = new THREE.Mesh(
                new THREE.ConeGeometry(7, 20, 4),
                new THREE.MeshLambertMaterial({ color: 0x2e5a44 })
            );
            spire.position.set(-20, 50, -35);
            spire.rotation.y = Math.PI / 4;
            scene.add(spire);

            // Textilfabrik
            const factory = new THREE.Mesh(
                new THREE.BoxGeometry(40, 22, 70),
                new THREE.MeshLambertMaterial({ color: 0x6e3828 })
            );
            factory.position.set(80, 11, 30);
            scene.add(factory);

            const chimney = new THREE.Mesh(
                new THREE.CylinderGeometry(2, 3.5, 45, 12),
                new THREE.MeshLambertMaterial({ color: 0x4a251a })
            );
            chimney.position.set(70, 22.5, 60);
            scene.add(chimney);

            // Bebyggelse längs gatorna
            for (let z = -120; z <= 120; z += 25) {
                if (Math.abs(z) < 15) continue;
                createBuilding(-55, z, 18, 12 + Math.random() * 6, 20, getRandomBuildingColor());
                createBuilding(15, z, 18, 10 + Math.random() * 8, 20, getRandomBuildingColor());
            }

            // Landmärken med fakta
            addLandmark(-20, 2, 0, "Stora Torget (1926)", "Här har Borås knallar sålt sina varor sedan 1600-talet. År 1926 var torget fyllt av torghandel, hästfordon och tidiga T-Fordar.");
            addLandmark(-20, 2, -30, "Gustav Adolfs Kyrka", "Uppförd efter den stora stadsbranden 1827 och invigd 1839. Kyrkan står som ett centralt landmärke i Borås.");
            addLandmark(40, 2, 0, "Stora Bron & Viskan", "Viskan har varit livsnerven för Borås textilindustri, där vattenkraft drev de tidiga väverierna.");
            addLandmark(80, 2, 30, "Textilindustrin (Algots m.fl.)", "Under 1920-talet upplevde Borås en stor textilboom och blev känd som Sveriges sytextilcentrum.");
        }

        function createBuilding(x, z, width, height, depth, color) {
            const geo = new THREE.BoxGeometry(width, height, depth);
            const mat = new THREE.MeshLambertMaterial({ color: color });
            const building = new THREE.Mesh(geo, mat);
            building.position.set(x, height / 2, z);
            scene.add(building);

            const roofGeo = new THREE.ConeGeometry(width * 0.7, 5, 4);
            const roofMat = new THREE.MeshLambertMaterial({ color: 0x3a2518 });
            const roof = new THREE.Mesh(roofGeo, roofMat);
            roof.position.set(x, height + 2.5, z);
            roof.rotation.y = Math.PI / 4;
            scene.add(roof);
        }

        function getRandomBuildingColor() {
            const colors = [0xd1c2a5, 0xb89b72, 0x8c7051, 0x9c5a43, 0x6e7861];
            return colors[Math.floor(Math.random() * colors.length)];
        }

        function addLandmark(x, y, z, title, text) {
            const geo = new THREE.SphereGeometry(1.2, 16, 16);
            const mat = new THREE.MeshBasicMaterial({ color: 0xffcc00, wireframe: true });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            scene.add(mesh);

            landmarks.push({ mesh: mesh, title: title, text: text, x: x, z: z });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            if (controls.isLocked === true) {
                const delta = (time - prevTime) / 1000;

                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                const speed = isSprinting ? 350.0 : 140.0;

                if (moveForward || moveBackward) velocity.z -= direction.z * speed * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * speed * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);

                const playerPos = controls.getObject().position;
                let nearAny = false;
                
                landmarks.forEach(lm => {
                    lm.mesh.rotation.y += 0.02;
                    const dist = Math.hypot(playerPos.x - lm.x, playerPos.z - lm.z);
                    if (dist < 8) {
                        document.getElementById('info-title').innerText = lm.title;
                        document.getElementById('info-text').innerText = lm.text;
                        document.getElementById('info-card').style.display = 'block';
                        nearAny = true;
                    }
                });

                if (!nearAny) {
                    document.getElementById('info-card').style.display = 'none';
                }
            }

            prevTime = time;
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
